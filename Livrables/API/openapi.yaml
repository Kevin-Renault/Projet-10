openapi: 3.0.3
info:
  title: Your Car Your Way API
  version: '1.1.1'
  description: >-
    API contract for the target platform and the chat proof of concept.
    Authentication, users and chat routes are implemented by the PoC.
    Reservation and payment routes describe the target platform only.
servers:
  - url: https://api.yourcaryourway.example.com
tags:
  - name: Authentication
  - name: Users
  - name: Chat
  - name: Target platform

paths:
  /api/auth/csrf:
    get:
      tags: [Authentication]
      summary: Get a CSRF token
      security: []
      responses:
        '204':
          description: CSRF token issued
          headers:
            X-XSRF-TOKEN:
              schema: { type: string }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      security: []
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: User registered and authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      security: []
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: User authenticated; tokens are set as cookies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token
      description: Reads the refresh token from the HttpOnly cookie. No request body is used.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: Session refreshed; rotated tokens are set as cookies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Session revoked and cookies cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Authentication]
      summary: Delete the current user account
      description: Deletes the authenticated account after password confirmation.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Account deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      description: Activates a pending account with a valid, single-use verification code.
      security: []
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email address verified and account activated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/env:
    get:
      tags: [Target platform]
      summary: Get the runtime environment
      description: Public diagnostic endpoint exposed by the PoC.
      security: []
      responses:
        '200':
          description: Runtime environment information
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/agencies:
    get:
      tags: [Target platform]
      summary: List rental agencies
      description: Returns agencies with their address and opening hours.
      security: []
      responses:
        '200':
          description: Agencies returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agency' }

  /api/agencies/{agencyId}:
    get:
      tags: [Target platform]
      summary: Get a rental agency
      security: []
      parameters: [{ $ref: '#/components/parameters/AgencyId' }]
      responses:
        '200':
          description: Agency returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/vehicles:
    get:
      tags: [Target platform]
      summary: List available vehicles
      description: Returns vehicles and their ACRISS classification.
      security: []
      parameters:
        - name: agencyId
          in: query
          schema: { type: string, format: uuid }
        - name: acrissCode
          in: query
          schema: { type: string, pattern: '^[A-Z0-9]{4}$' }
      responses:
        '200':
          description: Vehicles returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }

  /api/offers/search:
    get:
      tags: [Target platform]
      summary: Search rental offers
      description: Searches available offers by departure, return, dates and ACRISS category.
      security: []
      parameters:
        - name: pickupAgencyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: returnAgencyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: startAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: acrissCode
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z0-9]{4}$' }
      responses:
        '200':
          description: Matching offers returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/offers/{offerId}:
    get:
      tags: [Target platform]
      summary: Get an offer
      security: []
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      responses:
        '200':
          description: Offer returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users:
    get:
      tags: [Users]
      summary: List users
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Users]
      summary: Update the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by id
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/chats:
    get:
      tags: [Chat]
      summary: List chats for the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Chats returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chat]
      summary: Create a chat
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatRequest' }
      responses:
        '200':
          description: Chat created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/chats/open:
    get:
      tags: [Chat]
      summary: List unassigned chats
      description: Agent-only endpoint.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Open chats returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chats/agent-view:
    get:
      tags: [Chat]
      summary: List chats in the agent view
      description: Agent-only endpoint.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            default: all
            enum: [all, closed, mine, waiting, assigned]
      responses:
        '200':
          description: Filtered chats returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chats/agent-events:
    get:
      tags: [Chat]
      summary: Subscribe to agent chat events
      description: Server-Sent Events stream for agents.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SseStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chats/{chatId}:
    get:
      tags: [Chat]
      summary: Get a chat
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200':
          description: Chat returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chats/{chatId}/claim:
    post:
      tags: [Chat]
      summary: Claim a chat
      description: Agent-only endpoint.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Chat claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/chats/{chatId}/release:
    post:
      tags: [Chat]
      summary: Release a chat
      description: Agent-only endpoint for the active assigned agent.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Chat released for reassignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/chats/{chatId}/close:
    post:
      tags: [Chat]
      summary: Close a chat
      description: Only the client participant can close the chat.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Chat closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/chats/{chatId}/events:
    get:
      tags: [Chat]
      summary: Subscribe to chat events
      description: Server-Sent Events stream for chat participants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200': { $ref: '#/components/responses/SseStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chats/{chatId}/participants:
    get:
      tags: [Chat]
      summary: List chat participants
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200':
          description: Participants returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatParticipant' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chat]
      summary: Add a chat participant
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddChatParticipantRequest' }
      responses:
        '200':
          description: Participant added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatParticipant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chats/{chatId}/messages:
    get:
      tags: [Chat]
      summary: List chat messages
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200':
          description: Messages returned in creation order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatText' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chat]
      summary: Send a chat message
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendChatTextRequest' }
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatText' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/reservations:
    get:
      tags: [Target platform]
      summary: List the current user's reservations
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, cancelled, completed] }
      responses:
        '200':
          description: Reservations returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Target platform]
      summary: Create a reservation
      description: Target-platform contract; not implemented by the chat PoC.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }

  /api/reservations/{reservationId}:
    get:
      tags: [Target platform]
      summary: Get a reservation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200':
          description: Reservation returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Target platform]
      summary: Modify a reservation
      description: Modification is allowed only more than 48 hours before the reservation starts.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationUpdate' }
      responses:
        '200':
          description: Reservation modified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Target platform]
      summary: Cancel a reservation
      description: 'Refund depends on the time before the reservation starts: 100% at least 7 days before, and 25% less than 7 days before. The 48-hour rule applies to reservation modifications, not to the refund percentage.'
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Reservation cancelled and refund policy applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationCancellation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/reservations/{reservationId}/payment:
    post:
      tags: [Target platform]
      summary: Initialize payment for a reservation
      description: >-
        Creates a payment session with the selected provider and returns the
        information required to continue the external payment journey. The
        payment is confirmed asynchronously through the payment webhook.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInitializationRequest' }
      responses:
        '201':
          description: Payment session initialized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitialization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/agency/users:
    get:
      tags: [Target platform]
      summary: List users for an agency application
      description: Agency integration endpoint.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/agency/reservations:
    get:
      tags: [Target platform]
      summary: List reservations for an agency application
      description: Agency integration endpoint.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reservations returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/agency/vehicles:
    get:
      tags: [Target platform]
      summary: List vehicles for an agency application
      description: Agency integration endpoint.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Vehicles returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/payments:
    post:
      tags: [Target platform]
      summary: Receive a payment webhook
      description: >-
        Target-platform contract; not implemented by the chat PoC. The endpoint
        accepts a provider webhook and normalizes it internally. Provider-specific
        headers, signature verification, event names and payloads must be defined
        after studying the official Stripe and PayPal APIs and selecting the
        provider versions for the target implementation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Event acknowledged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AgencyId:
      name: agencyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  responses:
    SseStream:
      description: Server-Sent Events stream
      content:
        text/event-stream:
          schema: { type: string }
    BadRequest: { description: Invalid request }
    Unauthorized: { description: Authentication required or invalid credentials }
    Forbidden: { description: Authenticated user is not allowed to perform this action }
    NotFound: { description: Resource not found }
    Conflict: { description: Request conflicts with the current resource state }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, dateOfBirth, address]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          description: Must contain upper/lower-case letters, a digit and a special character.
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        address: { type: string, maxLength: 500 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 72 }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 72 }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, minLength: 1, maxLength: 20 }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Access JWT returned by the PoC for compatibility. }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, description: Always empty in API responses. }
        role: { type: string, enum: [client, agent] }
        preferredLanguage: { type: string, pattern: '^[a-z]{2}$', default: fr, description: Preferred language persisted for the user. ISO 639-1 code. }
        createdAt: { type: string, format: date-time }
    CreateChatRequest:
      type: object
      properties:
        subject: { type: string, maxLength: 255 }
        bookingId: { type: integer, format: int64 }
        participantIds:
          type: array
          items: { type: integer, format: int64 }
    Chat:
      type: object
      required: [id, chatUuid, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        chatUuid: { type: string, format: uuid }
        subject: { type: string }
        bookingId: { type: integer, format: int64, nullable: true }
        createdBy: { type: integer, format: int64 }
        status: { type: string, enum: [open, assigned, waiting_reassignment, closed, archived] }
        assignedAgentId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AddChatParticipantRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64 }
        role: { type: string, enum: [client, agent, system] }
    ChatParticipant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        chatId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        role: { type: string, enum: [client, agent, system] }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
    SendChatTextRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
        contentType: { type: string, maxLength: 20 }
    ChatText:
      type: object
      properties:
        id: { type: string, format: uuid, description: 'Public message UUID; internal database id is not exposed.' }
        chatId: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        contentType: { type: string }
        content: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Agency:
      type: object
      required: [id, name, city, address, openingHours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        openingHours:
          type: array
          items: { $ref: '#/components/schemas/OpeningHour' }
    OpeningHour:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        opensAt: { type: string, format: time }
        closesAt: { type: string, format: time }
    Vehicle:
      type: object
      required: [id, acrissCode, make, model, seats, status]
      properties:
        id: { type: string, format: uuid, description: 'Public vehicle UUID; internal database id is not exposed.' }
        acrissCode: { type: string, pattern: '^[A-Z0-9]{4}$' }
        make: { type: string }
        model: { type: string }
        variant: { type: string }
        seats: { type: integer, minimum: 1 }
        status: { type: string, enum: [available, reserved, maintenance, retired] }
        acrissDetails: { $ref: '#/components/schemas/AcrissDetails' }
    AcrissDetails:
      type: object
      properties:
        category: { type: string }
        vehicleType: { type: string }
        transmissionDrive: { type: string }
        fuelAirConditioning: { type: string }
        passengerVanDescription: { type: string }
    Offer:
      type: object
      required: [id, vehicle, agency, dailyPrice, currency, available]
      properties:
        id: { type: string, format: uuid }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        agency: { $ref: '#/components/schemas/Agency' }
        dailyPrice: { type: number, format: float, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        available: { type: boolean }
        availableFrom: { type: string, format: date-time }
        availableTo: { type: string, format: date-time }
    ReservationCreate:
      type: object
      required: [offerId, startDate, endDate]
      properties:
        offerId: { type: string, format: uuid }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        pickupAgencyId: { type: string, format: uuid }
        returnAgencyId: { type: string, format: uuid }
    ReservationUpdate:
      type: object
      required: [startDate, endDate]
      properties:
        offerId: { type: string, format: uuid }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        pickupAgencyId: { type: string, format: uuid }
        returnAgencyId: { type: string, format: uuid }
    Reservation:
      type: object
      required: [id, offerId, status, startDate, endDate, totalPrice, currency]
      properties:
        id: { type: string, format: uuid }
        offerId: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, cancelled, completed] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        pickupAgencyId: { type: string, format: uuid }
        returnAgencyId: { type: string, format: uuid }
        totalPrice: { type: number, format: float, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ReservationCancellation:
      type: object
      required: [reservation, refundPercentage, refundAmount, refundCurrency, refundStatus]
      properties:
        reservation: { $ref: '#/components/schemas/Reservation' }
        refundPercentage: { type: integer, enum: [25, 100] }
        refundAmount: { type: number, format: float, minimum: 0 }
        refundCurrency: { type: string, minLength: 3, maxLength: 3 }
        refundStatus: { type: string, enum: [not_refunded, pending, processed, failed] }
        refundPolicyCode: { type: string, maxLength: 50, description: Reference code of the policy applied to the cancellation. }
    PaymentInitializationRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [stripe, paypal]
          description: Payment provider selected for the external payment journey.
    PaymentInitialization:
      type: object
      required: [id, reservationId, provider, status, amount, currency, checkoutUrl]
      properties:
        id: { type: string, format: uuid, description: Internal payment identifier. }
        reservationId: { type: string, format: uuid }
        provider: { type: string, enum: [stripe, paypal] }
        providerPaymentId: { type: string, description: Provider payment or checkout identifier when available. }
        status: { type: string, enum: [pending, requires_action, processing] }
        amount: { type: number, format: double, minimum: 0, description: Amount to be paid in the reservation currency. }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 currency code. }
        checkoutUrl: { type: string, format: uri, description: URL or provider entry point for the external payment journey. }
        expiresAt: { type: string, format: date-time }
    PaymentWebhook:
      type: object
      required: [event_id, type, data]
      properties:
        event_id: { type: string, description: Provider event identifier; provider-specific naming may differ. }
        type: { type: string, description: Provider event type before internal normalization. }
        created: { type: integer, format: int64, description: Provider event timestamp when available. }
        data: { type: object, additionalProperties: true, description: Provider payload before internal normalization. }
