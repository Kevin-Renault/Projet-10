spring.config.import=optional:file:.env[.properties]

# PostgreSQL is provided by Docker Compose on localhost:5432.
spring.datasource.url=jdbc:postgresql://localhost:5432/ycyw_poc
spring.datasource.username=app_user
spring.datasource.password=change_me_locally

# Database initialization is handled by Docker Compose.
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT (cookie httpOnly, compatible with requests using credentials)
security.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-2026}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}

spring.profiles.active=dev
security.jwt.cookie-name=${JWT_COOKIE_NAME:access_token}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-samesite=${JWT_COOKIE_SAMESITE:Lax}