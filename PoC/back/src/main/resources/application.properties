# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_YCYW_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
# Execute separate SQL files in order (keeps files exploded)
# PL/pgSQL trigger functions are kept as a manual PostgreSQL migration because
# Spring's default SQL splitter cannot execute dollar-quoted blocks safely.
spring.sql.init.schema-locations=classpath:00_extensions_and_settings.sql,classpath:01_acriss_vehicle.sql,classpath:02_types_enums.sql,classpath:03_auth_schema.sql,classpath:04_core_domain.sql,classpath:05_chat.sql,classpath:07_indexes_constraints.sql,classpath:08_reference_data.sql,classpath:09_person_seed.sql
# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (cookie httpOnly par défaut, compatible avec CredentialsInterceptor (withCredentials))
# IMPORTANT: définissez JWT_SECRET (>= 32 caractères) en variable d'environnement.
security.jwt.secret=${JWT_SECRET}
# Access token (court) : utilisé par JwtAuthenticationFilter sur toutes les routes
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# Refresh token (long) : utilisé uniquement pour /api/auth/refresh (persisté en DB)
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}

# Profil actif par défaut (modifiable selon l'environnement)
spring.profiles.active=dev
security.jwt.cookie-name=${JWT_COOKIE_NAME:access_token}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-samesite=${JWT_COOKIE_SAMESITE:Lax}